<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>走进高州 · 传统文化</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--text:#2a2118;--sub:#7a6a58;--accent:#b3261e;--accent2:#c98a1b;--line:#eadfcf;--chip:#f3e9d8;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1613;--card:#262019;--text:#f1e8da;--sub:#b3a38e;--accent:#ff8a7e;--accent2:#e6b04a;--line:#3a3128;--chip:#352c22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1613;--card:#262019;--text:#f1e8da;--sub:#b3a38e;--accent:#ff8a7e;--accent2:#e6b04a;--line:#3a3128;--chip:#352c22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Noto Serif SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;padding:18px 0 8px}
header h1{margin:0;font-size:28px;letter-spacing:6px;color:var(--accent)}
header p{margin:6px 0 0;color:var(--sub);font-size:14px;letter-spacing:2px}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--text);padding:8px 16px;border-radius:999px;font-size:15px;font-family:inherit;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
nav button:focus-visible,.opt:focus-visible,.next:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:22px}
.tag{color:var(--accent2);font-size:13px;letter-spacing:1px;margin-bottom:10px}
.card p{margin:8px 0}
.facts{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.facts li{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px}
.facts b{color:var(--accent)}
.note{color:var(--sub);font-size:12px;text-align:center;margin-top:18px}
.q{font-size:17px;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer}
.opt.ok{background:#1f7a3d;color:#fff;border-color:#1f7a3d}
.opt.bad{background:var(--accent);color:#fff;border-color:var(--accent)}
.exp{color:var(--sub);font-size:14px;margin-top:8px}
.next{margin-top:10px;padding:10px 22px;border:0;border-radius:999px;background:var(--accent2);color:#1a1613;font-size:15px;font-family:inherit;cursor:pointer}
.score{font-size:40px;color:var(--accent);text-align:center;margin:10px 0}
.date{font-size:34px;color:var(--accent);margin:0 0 6px}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.ev:first-of-type{border-top:0}
.ev b{flex:0 0 64px;color:var(--accent2)}
.hint{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--sub);margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>走进高州</h1><p>岭南文化 · 粤西古邑</p></header>
  <nav id="nav" role="tablist"></nav>
  <main id="main"></main>
  <div class="note">内容为文化科普简介，具体史实与数据请以官方资料为准。</div>
</div>
<script>
(function(){
var DATA=[
{id:"xian",name:"冼夫人",tag:"千年巾帼 · 岭南之光",
 body:["冼夫人是南北朝至隋初时期岭南俚族的杰出首领，生活在今茂名、高州一带的高凉地区。她一生致力于民族团结与国家统一，推动岭南与中原的融合，被后世尊为“岭南圣母”。","高州及周边至今保留众多冼太庙与纪念活动，民间对冼太的敬仰绵延千余年。"],
 facts:[["时代","南北朝至隋初"],["身份","高凉俚族首领，受朝廷册封"],["精神","团结统一、保境安民、造福百姓"]]},
{id:"puppet",name:"木偶戏",tag:"方寸之间 · 演绎千秋",
 body:["高州木偶戏是粤西地区有代表性的传统戏曲艺术，以杖头木偶为主，艺人在幕后操纵木偶，同时配唱配乐，表演生动细腻。","传统剧目多取材于历史故事与民间传说，常在节庆、庙会和年例期间演出，是乡土文化的重要载体。"],
 facts:[["类型","杖头木偶戏"],["特点","一人多角、唱做结合、乡土气息浓"],["场合","节庆、庙会、年例"]]},
{id:"nianli",name:"年例",tag:"粤西春节 · 一村一日",
 body:["年例是粤西茂名、湛江、阳江一带流传的传统民俗，各村按固定日期举办，被称为“粤西人的第二个春节”。","活动期间祭祀神明、舞龙舞狮、演戏、游神，家家户户宴请亲朋好友，外出的游子也会赶回团聚，是乡情与亲情的集中体现。"],
 facts:[["时间","各村不同，多在春节前后至春季"],["内容","祭祀、游神、演戏、舞龙舞狮、宴请亲友"],["意义","凝聚乡情，团圆共庆"]]},
{id:"lizhi",name:"荔枝",tag:"岭南佳果 · 贡园古树",
 body:["高州是岭南著名的荔枝产区，根子镇一带有历史悠久的荔枝贡园和大片古荔枝树。种植荔枝的传统延续多个世纪，形成了独特的荔枝文化。","每年夏季荔枝成熟，果农采摘、运输、销往各地，荔枝既是美味，也是高州农耕文化与地方经济的重要象征。"],
 facts:[["季节","每年约五至七月"],["代表品种","白糖罂、妃子笑等"],["看点","贡园古树、荔枝林、采摘体验"]]},
{id:"today",name:"历史上的今天",tag:"高州大事记",kind:"today"},
{id:"person",name:"今日人物",tag:"每日一位高州先贤",kind:"person"},
{id:"quiz",name:"趣味问答",tag:"测测你对高州文化的了解",quiz:true}
];
var QUIZ=[
{q:"被称为“岭南圣母”的历史人物是谁？",o:["花木兰","冼夫人","梁红玉","穆桂英"],a:1,e:"冼夫人是岭南俚族首领，一生促进民族团结与国家统一。"},
{q:"高州木偶戏主要属于哪种木偶类型？",o:["布袋木偶","提线木偶","杖头木偶","皮影"],a:2,e:"高州木偶戏以杖头木偶为主，由艺人在幕后操纵。"},
{q:"粤西人常说的“第二个春节”指的是？",o:["中秋","年例","端午","元宵"],a:1,e:"年例是粤西各村按固定日期举行的传统民俗，热闹堪比春节。"},
{q:"高州根子镇以什么闻名？",o:["茶叶","蚕桑","荔枝贡园","陶瓷"],a:2,e:"根子镇有荔枝贡园和大片古荔枝树。"}
];
/* 历史事件：md 为“月-日”（如 "03-15"），核实后填写即可在当天显示；未填 md 的只出现在大事记里 */
var EVENTS=[
{y:589,t:"隋朝设置高州"},
{y:607,t:"高州一度撤销，改置高凉郡"},
{y:623,t:"唐初恢复高州建置"},
{y:684,t:"高力士出生，祖籍潘州（今高州一带）"},
{y:762,t:"高力士去世，陪葬唐玄宗泰陵"},
{y:1368,t:"明初升为高州府，统辖周边数县"},
{y:1912,t:"辛亥革命后废府"},
{y:1983,t:"高州县划归新设立的茂名市"}
];
/* 每日人物：按日期轮换，可继续往后添加（请先核实史料） */
var PEOPLE=[
{n:"冼夫人",life:"约 6 世纪",role:"高凉俚族首领",bio:"南北朝至隋初岭南的杰出女首领，嫁高凉太守冯宝，协助治理地方，维护岭南安定，推动与中原的融合，被后世尊为“岭南圣母”。",pts:["关键词：团结统一、保境安民","高州及周边至今保留冼太庙与纪念活动"]},
{n:"冯盎",life:"隋唐之际",role:"高凉地区首领",bio:"出身冼夫人家族，隋唐之际岭南有影响力的地方首领，归附唐朝后被任命主持高州一带事务，对稳定岭南局势起过重要作用。",pts:["家族：冼夫人、冯宝一脉","后人中有唐代著名宦官高力士"]},
{n:"高力士",life:"684 年—762 年",role:"唐代政治人物",bio:"本名冯元一，祖籍潘州（今高州一带），冯盎后人。幼年入宫，被高延福收养后改名高力士，受武则天赏识，后协助唐玄宗平定内乱，深得信任，官至骠骑大将军，封齐国公。",pts:["晚年陪伴玄宗，忠诚见称","去世后陪葬唐玄宗泰陵，墓在陕西蒲城"]},
{n:"潘茂名",life:"西晋至东晋时期",role:"道士、传说人物",bio:"古代著名道士，被后人称为“潘仙”，潘州、茂名等地名相传源于他，是粤西地名文化的重要渊源。",pts:["关键词：潘仙、地名由来","生平多带传说色彩，细节有待史料考证"]}
];
var nav=document.getElementById("nav"),main=document.getElementById("main");
function h(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function show(id){
  Array.prototype.forEach.call(nav.children,function(b){b.setAttribute("aria-selected",b.dataset.id===id)});
  var it=DATA.filter(function(x){return x.id===id})[0];
  if(it.quiz){return quiz()}
  if(it.kind==='today'){return today()}
  if(it.kind==='person'){return person()}
  var html='<div class="card"><h2>'+h(it.name)+'</h2><div class="tag">'+h(it.tag)+'</div>';
  it.body.forEach(function(p){html+="<p>"+h(p)+"</p>"});
  html+='<ul class="facts">';
  it.facts.forEach(function(f){html+="<li><b>"+h(f[0])+"：</b>"+h(f[1])+"</li>"});
  html+="</ul></div>";
  main.innerHTML=html;
}
function today(){
  var d=new Date(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2),md=m+'-'+dd;
  var hit=EVENTS.filter(function(e){return e.md===md});
  var html='<div class="card"><div class="tag">历史上的今天</div><div class="date">'+(d.getMonth()+1)+' 月 '+d.getDate()+' 日</div>';
  if(hit.length){hit.forEach(function(e){html+='<div class="ev"><b>'+e.y+'</b><span>'+h(e.t)+'</span></div>'})}
  else{html+='<div class="hint">今天暂无已核实的日期记录，来看看高州大事记吧。</div>'}
  html+='</div><div class="card"><h2>高州大事记</h2><div class="tag">按年份排序</div>';
  EVENTS.slice().sort(function(a,b){return a.y-b.y}).forEach(function(e){html+='<div class="ev"><b>'+e.y+'</b><span>'+h(e.t)+'</span></div>'});
  html+='</div>';
  main.innerHTML=html;
}
function person(){
  var d=new Date(),doy=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(d.getFullYear(),0,0))/864e5);
  var p=PEOPLE[doy%PEOPLE.length];
  var html='<div class="card"><div class="tag">今日人物 · '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日</div><h2>'+h(p.n)+'</h2><p style="color:var(--sub);margin:0">'+h(p.life)+' · '+h(p.role)+'</p><p>'+h(p.bio)+'</p><ul class="facts">';
  p.pts.forEach(function(x){html+='<li>'+h(x)+'</li>'});
  html+='</ul></div>';
  main.innerHTML=html;
}
function quiz(){
  var i=0,score=0;
  function render(){
    if(i>=QUIZ.length){
      main.innerHTML='<div class="card"><h2>答题完成</h2><div class="score">'+score+" / "+QUIZ.length+'</div><p style="text-align:center">'+(score===QUIZ.length?"满分！你是高州文化小达人。":"继续了解高州文化吧。")+'</p><div style="text-align:center"><button class="next" id="again">再来一次</button></div></div>';
      document.getElementById("again").onclick=function(){i=0;score=0;render()};
      return;
    }
    var q=QUIZ[i],html='<div class="card"><div class="tag">第 '+(i+1)+" / "+QUIZ.length+' 题</div><div class="q">'+h(q.q)+"</div>";
    q.o.forEach(function(t,k){html+='<button class="opt" data-k="'+k+'">'+h(t)+"</button>"});
    html+='<div id="fb"></div></div>';
    main.innerHTML=html;
    var done=false;
    Array.prototype.forEach.call(main.querySelectorAll(".opt"),function(b){
      b.onclick=function(){
        if(done)return;done=true;
        var k=+b.dataset.k;
        if(k===q.a){score++;b.classList.add("ok")}else{b.classList.add("bad");main.querySelectorAll(".opt")[q.a].classList.add("ok")}
        document.getElementById("fb").innerHTML='<div class="exp">'+h(q.e)+'</div><button class="next" id="nx">'+(i===QUIZ.length-1?"查看成绩":"下一题")+"</button>";
        document.getElementById("nx").onclick=function(){i++;render()};
      };
    });
  }
  render();
}
DATA.forEach(function(it){
  var b=document.createElement("button");
  b.textContent=it.name;b.dataset.id=it.id;b.setAttribute("role","tab");
  b.onclick=function(){show(it.id)};
  nav.appendChild(b);
});
show("xian");
})();
</script>
</body>
</html>
